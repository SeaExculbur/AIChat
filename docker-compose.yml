services:
  db:
    image: postgres:18-alpine
    volumes:
      # PostgreSQL 18 起 PGDATA 改到 /var/lib/postgresql/18/docker，
      # 官方镜像声明的卷是 /var/lib/postgresql，不能再挂 .../data
      - ./pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: aichat
      POSTGRES_PASSWORD: aichat_dev
      POSTGRES_DB: aichat
    restart: unless-stopped
    
  flask:
    build: ./backend
    volumes:
      - ./data:/app/instance
    env_file:
      - ./backend/.env.production
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - flask
    restart: unless-stopped
