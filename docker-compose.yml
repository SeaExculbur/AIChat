services:
  db:
    image: postgres:18-alpine
    volumes:
      # PostgreSQL 18 起 PGDATA 改到 /var/lib/postgresql/18/docker，
      # 官方镜像声明的卷是 /var/lib/postgresql，不能再挂 .../data
      - ./pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: aichat
      # 密码来自项目根目录 .env（Compose 自动读取），与 backend/.env.production 的 DATABASE_URL 保持一致
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aichat
    restart: unless-stopped
    
  flask:
    build: ./backend
    volumes:
      - ./data:/app/instance
    env_file:
      - ./backend/.env.production
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot 写 ACME 挑战文件用的目录，nginx 只读挂载去提供验证
      - ./certbot/www:/var/www/certbot:ro
      # Let's Encrypt 证书，nginx 只读读取
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - flask
    restart: unless-stopped
