server {
    listen 80;
    server_name seaexculbur.com www.seaexculbur.com;

    # Let's Encrypt HTTP-01 验证，续期时也要用，不能删
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 请求全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name seaexculbur.com www.seaexculbur.com;

    ssl_certificate     /etc/letsencrypt/live/seaexculbur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seaexculbur.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://flask:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应：不缓冲，且要扛住 DeepSeek 首字静默 + 长输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
